name: Universal Resource Discovery
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Campaign ID"
        required: true
        type: string
      campaign_url:
        description: "Campaign URL"
        required: false
        default: ""
        type: string
      reference_urls:
        description: "Campaign reference URLs as JSON"
        required: false
        default: "[]"
        type: string
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run universal resource discovery
        run: node .github/scripts/resource-discovery-worker.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CAMPAIGN_URL: ${{ inputs.campaign_url }}
          REFERENCE_URLS: ${{ inputs.reference_urls }}
      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-discovery-${{ inputs.campaign_id }}
          path: resource-discovery-artifact
          if-no-files-found: warn
          retention-days: 7
