name: Phase 14 Content Rewards Playwright Submission

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the queue and UI without clicking final Submit"
        required: true
        type: boolean
        default: true
      max_age_minutes:
        description: "Maximum publication age accepted for submission"
        required: false
        type: string
        default: "30"

permissions:
  contents: write
  actions: read

concurrency:
  group: phase14-playwright-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Process every eligible queued submission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_AGE_MINUTES: ${{ inputs.max_age_minutes }}
      CONTENT_REWARDS_STORAGE_STATE_B64: ${{ secrets.CONTENT_REWARDS_STORAGE_STATE_B64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/playwright/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Python syntax preflight
        run: python -m py_compile .github/scripts/phase14-playwright-submit.py
      - name: Validate queue and browser session
        if: inputs.dry_run
        run: python .github/scripts/phase14-playwright-submit.py --dry-run
      - name: Submit queued posts
        if: inputs.dry_run == false
        run: python .github/scripts/phase14-playwright-submit.py
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase14-playwright-evidence-${{ github.run_id }}
          path: phase14-playwright-artifacts/
          if-no-files-found: ignore
          retention-days: 14
