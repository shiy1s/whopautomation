name: Phase 6 Clip Planning

on:
  workflow_dispatch:
    inputs:
      phase5_run_id:
        description: "Successful Phase 5 GitHub Actions run ID"
        required: true
        type: string
      phase4b_run_id:
        description: "Successful Phase 4B GitHub Actions run ID used as evidence source"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  phase6:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source run IDs
        id: source
        env:
          PHASE5_RUN_ID: ${{ inputs.phase5_run_id }}
          PHASE4B_RUN_ID: ${{ inputs.phase4b_run_id }}
        run: |
          set -euo pipefail
          test -n "$PHASE5_RUN_ID"
          test -n "$PHASE4B_RUN_ID"
          echo "phase5_run_id=$PHASE5_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "phase4b_run_id=$PHASE4B_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify Phase 5 run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.phase5_run_id }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')
          test "$CONCLUSION" = "success"

      - name: Verify Phase 4B run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.phase4b_run_id }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')
          test "$CONCLUSION" = "success"

      - name: Download exact Phase 5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.phase5_run_id }}
        run: |
          set -euo pipefail
          mkdir -p phase5-source
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name mediasilo-clip-selection --dir phase5-source
          test -f phase5-source/phase5-selection-manifest.json
          test -f phase5-source/candidate-index.json

      - name: Download exact Phase 4B artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.phase4b_run_id }}
        run: |
          set -euo pipefail
          mkdir -p phase4b-source
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name mediasilo-ai-semantic-analysis --dir phase4b-source
          test -f phase4b-source/phase4-analysis/phase4-analysis-manifest.json

      - name: Run Phase 6 clip planning
        run: |
          set -euo pipefail
          python .github/scripts/phase6-clip-planning.py

      - name: Validate Phase 6 artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("phase6-clip-plan/phase6-clip-plan-manifest.json")
          m=json.loads(p.read_text())
          if m.get("complete") is not True:
              raise SystemExit("Phase 6 manifest is not complete=true")
          if int(m.get("clipPlanCount") or 0) < 1 or len(m.get("clipPlans", [])) < 1:
              raise SystemExit("Phase 6 clip-plan count failed")
          for p in m["clipPlans"]:
              if not p.get("planId") or not p.get("segments"):
                  raise SystemExit("Phase 6 plan missing segment provenance")
              total=sum(float(s["durationSeconds"]) for s in p["segments"])
              if abs(total-float(p["durationSeconds"])) > 0.25:
                  raise SystemExit("Phase 6 segment duration sum mismatch")
              if not 10 <= float(p["durationSeconds"]) <= 60:
                  raise SystemExit("Phase 6 plan outside 10-60s renderer bounds")
              seen_assets=set()
              seen_candidates=set()
              for s in p["segments"]:
                  if not s.get("assetId") or not s.get("fileName") or not s.get("candidateId"):
                      raise SystemExit("Missing Phase 6 segment provenance")
                  if s["candidateId"] in seen_candidates:
                      raise SystemExit("Duplicate candidate in Phase 6 plan")
                  seen_candidates.add(s["candidateId"])
                  start=float(s["startSeconds"]); end=float(s["endSeconds"]); source=float(s["sourceDurationSeconds"])
                  if start < 0 or end > source or end <= start:
                      raise SystemExit("Phase 6 segment boundary outside source duration")
                  if s.get("boundaryMethod") != "sampled-evidence-midpoint":
                      raise SystemExit("Unexpected boundary method")
                  seen_assets.add(s["assetId"])
          print("PHASE6_ARTIFACT_VALIDATION_PASS")
          PY

      - name: Upload Phase 6 clip plan
        uses: actions/upload-artifact@v4
        with:
          name: mediasilo-clip-plan
          path: phase6-clip-plan
          if-no-files-found: error
          retention-days: 30
