name: RICOCHET Campaign Preflight

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Drive video URL"
        required: true
        type: string

      official_source_confirmed:
        description: "Confirm this video came from the official campaign footage"
        required: true
        default: "true"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  campaign-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

          python -m pip install \
            --upgrade \
            --disable-pip-version-check \
            pip

          python -m pip install \
            --disable-pip-version-check \
            google-genai \
            gdown


      # ============================================================
      # 3. DOWNLOAD SOURCE VIDEO
      # ============================================================

      - name: Download source video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |

          set -euo pipefail

          mkdir -p work

          echo "Downloading campaign source video..."

          gdown "$VIDEO_URL" -O work/source.mp4

          if [ ! -s work/source.mp4 ]; then
            echo "ERROR: Video download failed."
            exit 1
          fi

          echo ""
          echo "Video downloaded successfully."
          echo ""

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            work/source.mp4


      # ============================================================
      # 4. AI CAMPAIGN COMPLIANCE CHECK
      # ============================================================

      - name: Run AI campaign compliance check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFICIAL_SOURCE_CONFIRMED: ${{ inputs.official_source_confirmed }}

        run: |

          set -euo pipefail

          cat > preflight.py <<'PY'

          import json
          import os
          import re
          import time

          from google import genai


          # ========================================================
          # INITIALIZATION
          # ========================================================

          API_KEY = os.environ.get("GEMINI_API_KEY")

          if not API_KEY:
              raise RuntimeError(
                  "GEMINI_API_KEY secret is missing."
              )

          client = genai.Client(
              api_key=API_KEY
          )


          # ========================================================
          # LOAD CAMPAIGN RULES
          # ========================================================

          with open(
              "campaign_rules.json",
              "r",
              encoding="utf-8"
          ) as f:

              rules = json.load(f)


          video_path = "work/source.mp4"


          print("")
          print("========================================")
          print("RICOCHET CAMPAIGN PREFLIGHT")
          print("========================================")
          print("")


          # ========================================================
          # UPLOAD VIDEO TO GEMINI
          # ========================================================

          print(
              "Uploading source video to Gemini..."
          )

          video_file = client.files.upload(
              file=video_path
          )


          # Wait until Gemini finishes processing
          while True:

              current = client.files.get(
                  name=video_file.name
              )

              state = getattr(
                  current.state,
                  "name",
                  str(current.state)
              )

              print(
                  "Gemini file state:",
                  state
              )

              if state == "ACTIVE":

                  video_file = current
                  break

              if state in (
                  "FAILED",
                  "ERROR"
              ):

                  raise RuntimeError(
                      "Gemini failed to process the video."
                  )

              time.sleep(5)


          print("")
          print(
              "Video is ready for AI analysis."
          )
          print("")


          # ========================================================
          # AI PROMPT
          # ========================================================

          prompt = f"""

          You are the strict campaign compliance reviewer for:

          Call of Duty — RICOCHET Enforcement Clipping.

          Your job is to inspect the ENTIRE uploaded video and decide
          whether it is suitable for creating compliant short-form
          social-media clips.

          ============================================================
          CAMPAIGN RULES
          ============================================================

          {json.dumps(
              rules,
              indent=2,
              ensure_ascii=False
          )}

          ============================================================
          SOURCE CONFIRMATION
          ============================================================

          The user has provided this confirmation:

          {os.environ["OFFICIAL_SOURCE_CONFIRMED"]}

          This means the user confirms that the source came from the
          official campaign footage.

          Do not claim independent verification of the original
          MediaSilo location unless the video itself proves it.

          ============================================================
          CHECK 1 — CAMPAIGN RELEVANCE
          ============================================================

          Determine whether the actual video is meaningfully related
          to the Call of Duty RICOCHET Anti-Cheat campaign.

          Look for:

          - RICOCHET
          - anti-cheat
          - cheating
          - cheat providers
          - cheat sellers
          - enforcement
          - legal enforcement
          - Call of Duty security
          - actions against cheat providers

          Reject clearly unrelated gaming footage.

          ============================================================
          CHECK 2 — OFFICIAL FOOTAGE
          ============================================================

          The campaign requires official campaign footage.

          The workflow input confirms whether the user says the source
          is official.

          Do not reject solely because the video does not contain an
          obvious watermark proving its source.

          ============================================================
          CHECK 3 — CALL OF DUTY BRANDING
          ============================================================

          Inspect the actual video.

          Determine:

          - whether Call of Duty branding is visible
          - approximately when it appears
          - whether it remains visible
          - whether branding could remain visible during a final clip

          Never invent branding.

          ============================================================
          CHECK 4 — RICOCHET / ANTI-CHEAT CONTEXT
          ============================================================

          Determine whether the footage communicates the campaign
          message.

          Pay particular attention to:

          - cheat providers
          - cheat sellers
          - enforcement actions
          - legal notices
          - anti-cheat operations
          - RICOCHET enforcement

          Do not invent legal claims or outcomes.

          ============================================================
          CHECK 5 — USABLE MATERIAL
          ============================================================

          Determine whether the source contains at least one strong
          section capable of becoming a 10–60 second Short.

          Look for:

          - strong hooks
          - surprising moments
          - confrontation
          - important dialogue
          - enforcement moments
          - emotional reactions
          - strong visual moments
          - satisfying conclusions

          ============================================================
          CHECK 6 — MISLEADING EDITING
          ============================================================

          Determine whether selecting portions of the video could
          easily create a misleading interpretation.

          Examples:

          - removing essential context
          - changing dialogue meaning
          - implying an event happened when it did not
          - presenting unrelated footage as RICOCHET enforcement

          Clearly misleading material should fail.

          ============================================================
          CHECK 7 — EXTERNAL / UNRELATED FOOTAGE
          ============================================================

          Identify clearly unrelated external footage.

          Normal editing elements are acceptable:

          - titles
          - campaign graphics
          - logos
          - subtitles
          - transitions

          ============================================================
          CHECK 8 — BURNED-IN CAPTIONS
          ============================================================

          Inspect the actual video for existing subtitles.

          Determine whether dialogue captions are already burned into
          the source.

          This information will be used later to prevent duplicate
          subtitles.

          ============================================================
          CHECK 9 — CONTENT ACCURACY
          ============================================================

          All future descriptions, titles and hashtags must be based
          on the actual video.

          Never invent:

          - people
          - companies
          - locations
          - legal outcomes
          - dates
          - statistics
          - quotes
          - events
          - cheating claims

          ============================================================
          APPROVAL RULES
          ============================================================

          approved = false if:

          - official source confirmation is false
          - footage is clearly unrelated to RICOCHET
          - there is no usable 10+ second material
          - footage is clearly misleading
          - footage is primarily unrelated external material

          Minor editing issues should become warnings instead of
          automatic rejection whenever they can safely be fixed later.

          ============================================================
          OUTPUT
          ============================================================

          Return ONLY valid JSON.

          Do NOT use Markdown.

          Do NOT use ```json.

          Use exactly this structure:

          {{
            "approved": true,
            "confidence": 95,
            "reason": "",

            "checks": {{

              "official_source": {{
                "pass": true,
                "reason": ""
              }},

              "campaign_relevance": {{
                "pass": true,
                "reason": ""
              }},

              "call_of_duty_branding": {{
                "pass": true,
                "reason": ""
              }},

              "ricochet_or_anticheat_context": {{
                "pass": true,
                "reason": ""
              }},

              "usable_10_second_material": {{
                "pass": true,
                "reason": ""
              }},

              "misleading_content": {{
                "pass": true,
                "reason": ""
              }},

              "external_or_unrelated_footage": {{
                "pass": true,
                "reason": ""
              }},

              "burned_in_captions": {{
                "detected": false,
                "reason": ""
              }}

            }},

            "warnings": [],

            "required_actions": []
          }}

          Be strict about campaign compliance but do not reject
          something simply because normal editing can fix it.
          """


          # ========================================================
          # GEMINI FALLBACK SYSTEM
          # ========================================================

          models = [

              "gemini-3.7-flash",

              "gemini-3.6-flash",

              "gemini-3.5-flash-lite"

          ]


          result = None
          last_error = None


          for model in models:

              print("")
              print("========================================")
              print(
                  "Trying Gemini model:",
                  model
              )
              print("========================================")

              for attempt in range(1, 4):

                  try:

                      print(
                          f"Attempt {attempt}/3"
                      )

                      response = client.models.generate_content(

                          model=model,

                          contents=[
                              video_file,
                              prompt
                          ]

                      )


                      text = response.text.strip()


                      # Remove accidental Markdown fences
                      text = re.sub(
                          r"^```json\s*",
                          "",
                          text,
                          flags=re.IGNORECASE
                      )

                      text = re.sub(
                          r"^```\s*",
                          "",
                          text
                      )

                      text = re.sub(
                          r"\s*```$",
                          "",
                          text
                      )


                      result = json.loads(
                          text
                      )


                      print("")
                      print(
                          "Gemini analysis succeeded."
                      )

                      print(
                          "Model used:",
                          model
                      )

                      break


                  except Exception as error:

                      last_error = error

                      print("")
                      print(
                          "Gemini request failed:"
                      )

                      print(
                          str(error)
                      )


                      if attempt < 3:

                          wait_time = (
                              10 * attempt
                          )

                          print(
                              f"Waiting {wait_time} seconds..."
                          )

                          time.sleep(
                              wait_time
                          )


              if result is not None:
                  break


              print("")
              print(
                  f"Model {model} failed."
              )

              print(
                  "Trying next fallback model..."
              )


          # ========================================================
          # ALL MODELS FAILED
          # ========================================================

          if result is None:

              raise RuntimeError(
                  "All Gemini models failed. "
                  f"Last error: {last_error}"
              )


          # ========================================================
          # VALIDATE RESULT
          # ========================================================

          if not isinstance(
              result,
              dict
          ):

              raise RuntimeError(
                  "Gemini returned invalid JSON."
              )


          if "approved" not in result:

              raise RuntimeError(
                  "Gemini response is missing "
                  "'approved'."
              )


          # ========================================================
          # SAVE RESULT
          # ========================================================

          with open(
              "preflight_result.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2,
                  ensure_ascii=False
              )


          print("")
          print("========================================")
          print("PREFLIGHT RESULT")
          print("========================================")

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False
              )
          )


          # ========================================================
          # HARD APPROVAL GATE
          # ========================================================

          if not result.get(
              "approved",
              False
          ):

              print("")
              print("========================================")
              print(
                  "CAMPAIGN PREFLIGHT: FAILED"
              )
              print("========================================")

              print(
                  result.get(
                      "reason",
                      "No reason supplied."
                  )
              )

              print("")
              print(
                  "Required actions:"
              )

              for action in result.get(
                  "required_actions",
                  []
              ):

                  print(
                      "-",
                      action
                  )


              raise SystemExit(1)


          print("")
          print("========================================")
          print(
              "CAMPAIGN PREFLIGHT: PASSED"
          )
          print("========================================")

          print(
              result.get(
                  "reason",
                  "Video passed campaign preflight."
              )
          )

          PY


          python preflight.py


      # ============================================================
      # 5. SAVE PREFLIGHT RESULT
      # ============================================================

      - name: Upload preflight result
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: campaign-preflight-result

          path: preflight_result.json

          if-no-files-found: ignore


      # ============================================================
      # 6. AUTOMATICALLY START AI VIDEO CLIPPING
      # ============================================================

      - name: Start AI Video Clipping
        if: ${{ success() }}

        env:

          GH_TOKEN: ${{ github.token }}

          VIDEO_URL: ${{ inputs.video_url }}

        run: |

          set -euo pipefail

          echo ""
          echo "========================================"
          echo "CAMPAIGN PREFLIGHT PASSED"
          echo "========================================"
          echo ""

          echo "Starting AI Video Clipping..."

          gh workflow run \
            "AI Video Clipping" \
            --ref main \
            -f video_url="$VIDEO_URL"

          echo ""

          echo "AI Video Clipping workflow dispatched successfully."

          echo ""
          echo "========================================"
          echo "PIPELINE STARTED"
          echo "========================================"
