name: Phase 14 Playwright Worker CI

on:
  pull_request:
    paths:
      - ".github/scripts/phase14-playwright-submit.py"
      - ".github/playwright/requirements.txt"
      - ".github/workflows/phase14-playwright-submit.yml"
      - "docs/phase14-playwright-submission.md"
  push:
    branches: [main]
    paths:
      - ".github/scripts/phase14-playwright-submit.py"
      - ".github/playwright/requirements.txt"

permissions:
  contents: read

jobs:
  static:
    name: Validate Playwright worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install pinned dependency
        run: python -m pip install -r .github/playwright/requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile worker
        run: python -m py_compile .github/scripts/phase14-playwright-submit.py
