name: MediaSilo Discovery Worker
"on":
  workflow_dispatch:
    inputs:
      review_url:
        description: MediaSilo review URL
        required: true
        type: string
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Crawl MediaSilo
        env:
          REVIEW_URL: ${{ inputs.review_url }}
        run: |
          cat > discover.mjs <<'NODE'
                    import { chromium } from 'playwright';
          import fs from 'node:fs';
          
          const reviewUrl = process.env.REVIEW_URL;
          if (!reviewUrl) throw new Error('REVIEW_URL missing');
          
          const origin = new URL(reviewUrl).origin;
          const assets = [];
          const folders = [];
          const visited = new Set();
          const queued = new Set([reviewUrl]);
          const queue = [{ url: reviewUrl, parentId: null, name: 'root' }];
          const mediaHits = [];
          const jsonHits = [];
          
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          
          function addMedia(url, ctx) {
            if (!url || !/^https?:/i.test(url)) return;
            if (/\\.(mp4|m3u8|mov|webm|m4v)([?#]|$)/i.test(url) || /cloudfront|mediasilo/i.test(url)) {
              mediaHits.push({ url, ctx });
            }
          }
          
          function addFolder(id, name, parentId, url) {
            if (!id) return;
            if (folders.some((folder) => folder.folderId === id)) return;
            folders.push({
              folderId: id,
              name: name || 'folder',
              parentId: parentId ?? null,
              url: url || null,
              assetCount: 0,
            });
          }
          
          function upsertAsset(asset) {
            if (!asset?.assetUrl && !asset?.assetId) return;
            const key = asset.assetId || asset.assetUrl;
            const index = assets.findIndex((item) => (item.assetId || item.assetUrl) === key);
            if (index < 0) {
              assets.push(asset);
              return;
            }
            const clean = Object.fromEntries(
              Object.entries(asset).filter(([, value]) => value !== null && value !== undefined && value !== ''),
            );
            assets[index] = { ...assets[index], ...clean };
          }
          
          function save(complete = false) {
            const output = {
              assets,
              folders,
              complete,
              mediaUrls: [...new Set(mediaHits.map((hit) => hit.url))],
              networkJson: jsonHits.slice(-200),
              visitedPages: [...visited],
              pageCount: visited.size,
              assetCount: assets.length,
              generatedAt: new Date().toISOString(),
            };
            fs.writeFileSync('mediasilo-discovery.json', JSON.stringify(output, null, 2));
          }
          
          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage'],
            timeout: 60000,
          });
          
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            ignoreHTTPSErrors: true,
          });
          
          context.on('response', async (response) => {
            try {
              const url = response.url();
              addMedia(url, 'network');
              const contentType = response.headers()['content-type'] || '';
              if (!contentType.includes('json')) return;
          
              const text = await response.text();
              if (!/asset|folder|derivative|media/i.test(text)) return;
          
              jsonHits.push({ url, body: text.slice(0, 30000) });
              fs.appendFileSync('mediasilo-network.log', url + '\\n' + text.slice(0, 30000) + '\\n');
            } catch {}
          });
          
          const page = await context.newPage();
          page.on('request', (request) => addMedia(request.url(), 'request'));
          page.on('response', (response) => addMedia(response.url(), 'response'));
          
          while (queue.length > 0) {
            const item = queue.shift();
            if (visited.has(item.url)) continue;
          
            visited.add(item.url);
            console.log('VISIT', item.url);
          
            try {
              await page.goto(item.url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            } catch (error) {
              console.log('NAV_ERROR', error.message);
            }
          
            await sleep(5000);
          
            const discovery = await page.evaluate(() => {
              const absoluteUrl = (value) => {
                try {
                  return new URL(value, location.href).href;
                } catch {
                  return null;
                }
              };
          
              const elements = [...document.querySelectorAll('a[href],button,[role="link"],[data-testid],video,source')];
          
              return {
                title: document.title,
                url: location.href,
                links: elements.map((element) => ({
                  href: absoluteUrl(element.getAttribute('href')),
                  text: (element.textContent || '').trim(),
                  aria: element.getAttribute('aria-label') || '',
                  testid: element.getAttribute('data-testid') || '',
                  tag: element.tagName,
                })),
                videos: [...document.querySelectorAll('video')].map((video) => ({
                  src: video.currentSrc || video.src || null,
                  duration: Number.isFinite(video.duration) ? video.duration : null,
                  width: video.videoWidth || null,
                  height: video.videoHeight || null,
                })),
              };
            });
          
            for (const video of discovery.videos) addMedia(video.src, item.url);
          
            const folderMatch = item.url.match(/\\/f\\/([^/?#]+)/i);
            const folderId = folderMatch?.[1] || item.url;
            addFolder(folderId, item.name || discovery.title || 'root', item.parentId, item.url);
            const folder = folders.find((entry) => entry.folderId === folderId);
          
            for (const link of discovery.links) {
              if (!link.href || !link.href.startsWith(origin)) continue;
          
              if (/\\/f\\//i.test(link.href) && !visited.has(link.href) && !queued.has(link.href)) {
                queued.add(link.href);
                queue.push({
                  url: link.href,
                  parentId: folderId,
                  name: link.text || link.aria || link.testid || 'folder',
                });
              }
          
              if (/\\/asset\\//i.test(link.href) || /\\/a\\//i.test(link.href)) {
                const idMatch = link.href.match(/([0-9a-f]{8}-[0-9a-f-]{27,})/i);
                upsertAsset({
                  assetId: idMatch?.[1] || null,
                  fileName: link.text || null,
                  title: link.text || null,
                  size: null,
                  duration: null,
                  resolution: null,
                  folder: folder?.name || 'root',
                  assetUrl: link.href,
                  directMediaUrl: null,
                });
              }
            }
          
            if (folder) {
              folder.assetCount = assets.filter((asset) => asset.folder === folder.name).length;
            }
          
            save(false);
          }
          
          for (const hit of jsonHits) {
            try {
              const root = JSON.parse(hit.body);
          
              const walk = (value, parentFolder = null) => {
                if (Array.isArray(value)) {
                  for (const child of value) walk(child, parentFolder);
                  return;
                }
          
                if (!value || typeof value !== 'object') return;
          
                const id = value.id || value.assetId || null;
                const name = value.name || value.title || value.fileName || null;
                const type = String(value.type || '').toLowerCase();
                const isAsset = Boolean((value.fileName || value.derivatives || value.duration || value.assetUrl) && id);
                const isFolder = Boolean((value.folderId || type === 'folder' || type === 'directory') && (name || id));
          
                if (isFolder) addFolder(id, name, parentFolder, hit.url);
          
                if (isAsset) {
                  const folderName = value.folderName || value.folder?.name || null;
                  const dimensions = value.dimensions;
                  const resolution = value.resolution || (dimensions ? String(dimensions.width || '') + 'x' + String(dimensions.height || '') : null);
          
                  upsertAsset({
                    assetId: id,
                    fileName: value.fileName || null,
                    title: value.title || value.name || null,
                    size: value.size ?? value.fileSize ?? null,
                    duration: value.duration ?? null,
                    resolution,
                    folder: folderName || parentFolder || 'root',
                    assetUrl: value.url || value.assetUrl || null,
                    directMediaUrl: value.directMediaUrl || null,
                  });
          
                  if (Array.isArray(value.derivatives)) {
                    for (const derivative of value.derivatives) {
                      if (derivative?.url) addMedia(derivative.url, 'json');
                    }
                  }
                }
          
                for (const child of Object.values(value)) walk(child, parentFolder);
              };
          
              walk(root);
            } catch (error) {
              console.log('JSON_PARSE_ERROR', error.message);
            }
          }
          
          for (const asset of assets) {
            if (asset.directMediaUrl) continue;
            const candidate = mediaHits.find((hit) => hit.ctx === asset.assetUrl || /download|derivative|media/i.test(hit.url));
            if (candidate) asset.directMediaUrl = candidate.url;
          }
          
          for (const folder of folders) {
            folder.assetCount = assets.filter((asset) => asset.folder === folder.name || asset.folder === folder.folderId).length;
          }
          
          save(true);
          await browser.close();
          
          NODE
          node --check discover.mjs
          node discover.mjs
      - name: Validate discovery artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='mediasilo-discovery.json';
          if(!fs.existsSync(p)) throw new Error('Discovery artifact missing');
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.complete!==true) throw new Error('Discovery did not finish completely');
          if(!Array.isArray(d.folders)||d.folders.length===0) throw new Error('No folders discovered');
          if(!Array.isArray(d.assets)||d.assets.length===0) throw new Error('No assets discovered');
          if(!Array.isArray(d.visitedPages)||d.visitedPages.length===0) throw new Error('No pages were traversed');
          const bad=d.assets.filter(a=>!a.assetId||!a.fileName||!a.folder||!a.assetUrl);
          if(bad.length) throw new Error('Invalid asset records: '+bad.length);
          console.log(JSON.stringify({complete:d.complete,folders:d.folders.length,assets:d.assets.length,visitedPages:d.visitedPages.length}));
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediasilo-discovery
          path: |
            mediasilo-discovery.json
            mediasilo-network.log
          retention-days: 7
          if-no-files-found: error
