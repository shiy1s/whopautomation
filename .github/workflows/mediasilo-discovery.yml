name: MediaSilo Discovery Worker
"on":
  workflow_dispatch:
    inputs:
      review_url:
        description: MediaSilo review URL
        required: true
        type: string
      discovery_json:
        description: Verified discovery seed JSON in base64
        required: true
        type: string
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Crawl MediaSilo
        env:
          REVIEW_URL: ${{ inputs.review_url }}
          DISCOVERY_JSON: ${{ inputs.discovery_json }}
        run: |
          echo "$DISCOVERY_JSON" | base64 -d > seed.json
          echo "" | base64 -d > discover.mjs
          node --check discover.mjs
          node discover.mjs
      - name: Validate discovery artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('mediasilo-discovery.json','utf8'));
          if(d.complete!==true) throw new Error('Discovery complete flag is not true');
          if(!Array.isArray(d.assets)||d.assets.length<2) throw new Error('Fewer than 2 assets');
          if(!Array.isArray(d.folders)||d.folders.length<3) throw new Error('Recursive folder inventory incomplete');
          if(!Array.isArray(d.visitedPages)||d.visitedPages.length<3) throw new Error('Recursive traversal evidence incomplete');
          if(d.assets.some(a=>!a.assetId||!a.fileName||!a.folder||!a.assetUrl)) throw new Error('Invalid asset records');
          const n=d.folders.map(f=>String(f.name||'').toLowerCase());
          if(!n.includes('background')||!n.includes('logos')) throw new Error('Background/LOGOS missing');
          console.log('PHASE1_DISCOVERY_VALIDATION_PASS assets='+d.assets.length+' folders='+d.folders.length+' visited='+d.visitedPages.length);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediasilo-discovery
          path: |
            mediasilo-discovery.json
            mediasilo-network.log
            mediasilo-debug.json
          retention-days: 7
          if-no-files-found: error
