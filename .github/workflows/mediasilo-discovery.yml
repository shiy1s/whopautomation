name: MediaSilo Discovery Worker\n"on":\n  workflow_dispatch:\n    inputs:\n      review_url:\n        description: MediaSilo review URL\n        required: true\n        type: string\n      discovery_json:\n        description: Verified discovery seed JSON in base64\n        required: true\n        type: string\njobs:\n  discover:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 24\n      - name: Install Playwright\n        run: |\n          npm init -y\n          npm install --no-audit --no-fund playwright@1.55.0\n          npx playwright install --with-deps chromium\n      - name: Crawl MediaSilo\n        env:\n          REVIEW_URL: ${{ inputs.review_url }}\n          DISCOVERY_JSON: ${{ inputs.discovery_json }}\n        run: |\n          echo "$DISCOVERY_JSON" | base64 -d > seed.json\n          echo "" | base64 -d > discover.mjs\n          node --check discover.mjs\n          node discover.mjs\n      - name: Validate discovery artifact\n        run: |\n          node --input-type=module <<'NODE'\n          import fs from 'node:fs';\n          const p='mediasilo-discovery.json';\n          if(!fs.existsSync(p)) throw new Error('Discovery artifact missing');\n          const d=JSON.parse(fs.readFileSync(p,'utf8'));\n          if(d.complete!==true) throw new Error('Discovery did not finish completely');\n          if(!Array.isArray(d.assets)||d.assets.length<2) throw new Error('Fewer than 2 assets');\n          if(!Array.isArray(d.folders)||d.folders.length<3) throw new Error('Recursive folder inventory incomplete');\n          if(!Array.isArray(d.visitedPages)||d.visitedPages.length<3) throw new Error('Recursive traversal evidence incomplete');\n          const n=d.folders.map(f=>String(f.name||'').toLowerCase());\n          if(!n.includes('background')||!n.includes('logos')) throw new Error('Background/LOGOS missing');\n          const base=d.assets.filter(a=>a.fileName==='RICOCHETvideo.mp4'||a.fileName==='Richochet_V05_9x16_Final.mp4');\n          if(base.length<2) throw new Error('Both baseline RICOCHET assets missing');\n          if(d.assets.some(a=>!a.assetId||!a.fileName||!a.folder||!a.assetUrl)) throw new Error('Invalid asset records');\n          console.log('PHASE1_DISCOVERY_VALIDATION_PASS assets='+d.assets.length+' folders='+d.folders.length+' visited='+d.visitedPages.length);\n          NODE\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: mediasilo-discovery\n          path: |\n            mediasilo-discovery.json\n            mediasilo-network.log\n            mediasilo-debug.json\n          retention-days: 7\n          if-no-files-found: error\n