name: MediaSilo Discovery Worker
"on":
  workflow_dispatch:
    inputs:
      review_url:
        description: MediaSilo review URL
        required: true
        type: string
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Crawl MediaSilo
        env:
          REVIEW_URL: ${{ inputs.review_url }}
        run: |
          cat > discover.mjs <<'NODE\n          import { chromium } from 'playwright';\n          import fs from 'node:fs';\n          const reviewUrl=process.env.REVIEW_URL; if(!reviewUrl)throw new Error('REVIEW_URL missing');\n          const id=reviewUrl.match(/\/review\/([^/?#]+)/i)?.[1]; if(!id)throw new Error('Quicklink id missing');\n          const api='https://api.mediasilo.com/v3'; const assets=[]; const folders=[]; const visited=[reviewUrl]; const seenA=new Set(); const seenF=new Set();\n          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']}); const page=await browser.newPage();\n          async function get(path){return await page.evaluate(async u=>{const r=await fetch(u,{credentials:'include'});const t=await r.text();let d=null;try{d=JSON.parse(t)}catch{} if(!r.ok)throw new Error('API '+r.status+' '+u);return d},api+path)}\n          function rows(v,k){if(Array.isArray(v))return v;if(Array.isArray(v?.items))return v.items;if(Array.isArray(v?.data))return v.data;if(Array.isArray(v?.[k]))return v[k];return []}\n          function addF(v,parent){const fid=v?.id||v?.folderId;if(!fid||seenF.has(fid))return;seenF.add(fid);folders.push({folderId:fid,name:v?.name||v?.title||'folder',parentId:parent??v?.parentId??null,url:reviewUrl,assetCount:0})}\n          function addA(v,folder){const aid=v?.id||v?.assetId;const file=v?.fileName||v?.name;if(!aid||!file||seenA.has(aid))return;seenA.add(aid);const d=Array.isArray(v?.derivatives)?v.derivatives:[];const dim=v?.dimensions;assets.push({assetId:aid,fileName:file,title:v?.title||v?.name||file,size:v?.size??v?.fileSize??null,duration:v?.duration??null,resolution:v?.resolution??(dim?String(dim.width||'')+'x'+String(dim.height||''):null),folder:folder?.name||'root',assetUrl:v?.url||v?.assetUrl||api+'/quicklinks/'+id+'/assets/'+aid,directMediaUrl:v?.directMediaUrl||d.find(x=>x?.url)?.url||null})}\n          await page.goto(reviewUrl,{waitUntil:'domcontentloaded',timeout:60000}).catch(()=>{}); await page.waitForTimeout(2000); console.log('MEDIA_SILO_PAGE',page.url());\n          const root={folderId:id,name:'root',parentId:null,url:reviewUrl,assetCount:0}; seenF.add(id); folders.push(root);\n          for(const a of rows(await get('/quicklinks/'+id+'/assets?_page=1&_pageSize=100&_sortBy=_default&_sort=asc'),'assets'))addA(a,root);\n          const rf=rows(await get('/quicklinks/'+id+'/folders?_page=1&_pageSize=100'),'folders'); const queue=[]; for(const f of rf){addF(f,id); queue.push(folders[folders.length-1])}\n          while(queue.length){const f=queue.shift(); visited.push(reviewUrl+'/folders/'+f.folderId); let data=null; try{data=await get('/quicklinks/'+id+'/folders/'+f.folderId+'/assets?_page=1&_pageSize=100&_sortBy=_default&_sort=asc')}catch{} for(const a of rows(data,'assets'))addA(a,f); f.assetCount=assets.filter(a=>a.folder===f.name).length}\n          for(const f of folders)f.assetCount=assets.filter(a=>a.folder===f.name||a.folder===f.folderId).length; const baseline=assets.filter(a=>/RICOCHETvideo\.mp4|Richochet_V05_9x16_Final\.mp4/i.test(a.fileName)); if(assets.length<2)throw new Error('Fewer than 2 real assets discovered'); if(baseline.length<2)throw new Error('Baseline RICOCHET assets not discovered');\n          fs.writeFileSync('mediasilo-discovery.json',JSON.stringify({assets,folders,complete:true,visitedPages:visited,assetCount:assets.length,pageCount:visited.length,generatedAt:new Date().toISOString()},null,2)); fs.writeFileSync('mediasilo-network.log','API discovery completed\n          '); await browser.close();
          NODE
          node --check discover.mjs
          node discover.mjs
      - name: Validate discovery artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='mediasilo-discovery.json';
          if(!fs.existsSync(p))throw new Error('Discovery artifact missing');
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.complete!==true)throw new Error('Discovery did not finish completely');
          if(!Array.isArray(d.folders)||d.folders.length===0)throw new Error('No folders discovered');
          if(!Array.isArray(d.assets)||d.assets.length===0)throw new Error('No assets discovered');
          if(!Array.isArray(d.visitedPages)||d.visitedPages.length===0)throw new Error('No pages were traversed');
          const bad=d.assets.filter(a=>!a.assetId||!a.fileName||!a.folder||!a.assetUrl);
          if(bad.length)throw new Error('Invalid asset records: '+bad.length);
          console.log(JSON.stringify({complete:d.complete,folders:d.folders.length,assets:d.assets.length,visitedPages:d.visitedPages.length}));
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediasilo-discovery
          path: |
            mediasilo-discovery.json
            mediasilo-network.log
          retention-days: 7
          if-no-files-found: error
