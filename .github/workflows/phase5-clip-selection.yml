name: Phase 5 Clip Selection

on:
  workflow_dispatch:
    inputs:
      phase4b_run_id:
        description: "Successful Phase 4B GitHub Actions run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select exact Phase 4B run
        id: source
        env:
          RUN_ID: ${{ inputs.phase4b_run_id }}
        run: |
          set -euo pipefail
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Verify Phase 4B run succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion')
          test "$CONCLUSION" = "success"

      - name: Download exact Phase 4B artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p phase4-source
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name mediasilo-ai-semantic-analysis \
            --dir phase4-source
          test -f phase4-source/phase4-analysis/phase4-analysis-manifest.json
          test -f phase4-source/phase4-source/phase4-input/phase4-input-manifest.json

      - name: Verify Phase 4B evidence contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("phase4-source/phase4-analysis")
          m=json.loads((root/"phase4-analysis-manifest.json").read_text())
          if m.get("complete") is not True:
              raise SystemExit("Phase 4B is not complete=true")
          if int(m.get("analysis",{}).get("assetCount") or 0) < 1 or int(m.get("analysis",{}).get("frameCount") or 0) < 1:
              raise SystemExit("Phase 4B count contract failed")
          for a in m.get("assets",[]):
              d=json.loads((root/a["analysisFile"]).read_text())
              if len(d.get("frames",[])) != 12:
                  raise SystemExit("Phase 4B frame contract failed")
          print("PHASE4B_EVIDENCE_CONTRACT_PASS")
          PY

      - name: Install Gemini SDK
        run: python -m pip install -q --disable-pip-version-check google-genai

      - name: Run Phase 5 selection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python .github/scripts/phase5-clip-selection.py

      - name: Validate Phase 5 artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("phase5-selection/phase5-selection-manifest.json")
          m=json.loads(p.read_text())
          if m.get("complete") is not True:
              raise SystemExit("Phase 5 manifest is not complete=true")
          if int(m.get("sourcePhase",{}).get("assetCount") or 0) < 1 or int(m.get("sourcePhase",{}).get("frameCount") or 0) < 1:
              raise SystemExit("Phase 5 source contract failed")
          selections=m.get("selections",[])
          if int(m.get("selectedCount") or 0) < 1 or not selections:
              raise SystemExit("Phase 5 selection count failed")
          seen_plans=set()
          for s in selections:
              segs=s.get("segments",[])
              if not segs:
                  raise SystemExit("Clip opportunity has no segments")
              plan_key=tuple(x.get("candidateId") for x in segs)
              if plan_key in seen_plans:
                  raise SystemExit("Duplicate clip opportunity")
              seen_plans.add(plan_key)
              if not s.get("rationale"):
                  raise SystemExit("Missing clip rationale")
              if not 0 <= float(s.get("confidence",-1)) <= 1:
                  raise SystemExit("Invalid clip confidence")
              total=sum(float(x.get("endSeconds",0))-float(x.get("startSeconds",0)) for x in segs)
              if not 10 <= total <= 60:
                  raise SystemExit("Clip opportunity duration outside 10-60s")
              for seg in segs:
                  if not seg.get("candidateId") or not seg.get("assetId") or not seg.get("fileName"):
                      raise SystemExit("Missing segment provenance")
          print("PHASE5_ARTIFACT_VALIDATION_PASS")
          PY

      - name: Upload Phase 5 selection artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediasilo-clip-selection
          path: phase5-selection
          if-no-files-found: error
          retention-days: 30
