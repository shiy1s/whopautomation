name: Phase 14 Content Rewards Submission Gate

on:
  workflow_dispatch:
    inputs:
      phase11_run_id:
        description: "Exact successful Phase 11 run ID that published the clip"
        required: true
        type: string
      campaign_id:
        description: "Exact active Content Rewards campaign ID"
        required: true
        type: string
      campaign_name:
        description: "Exact campaign name shown by Content Rewards"
        required: true
        type: string
      campaign_status:
        description: "Current campaign status verified in Content Rewards"
        required: true
        type: choice
        options:
          - active
          - exhausted
          - closed
          - unknown
        default: active
      platform:
        description: "Published platform to submit"
        required: true
        type: choice
        options:
          - youtube
          - instagram
        default: youtube
      clip_file:
        description: "Exact published clip"
        required: true
        type: choice
        options:
          - clip_01.mp4
          - clip_02.mp4
        default: clip_01.mp4
      post_url:
        description: "Exact public post URL. Required for Instagram; optional for YouTube."
        required: false
        type: string
      confirm_submission:
        description: "Type SUBMIT_READY only after verifying the active campaign and URL in Content Rewards"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase14-content-rewards-submission
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare gated Content Rewards submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE11_RUN_ID: ${{ inputs.phase11_run_id }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_NAME: ${{ inputs.campaign_name }}
      CAMPAIGN_STATUS: ${{ inputs.campaign_status }}
      PLATFORM: ${{ inputs.platform }}
      CLIP_FILE: ${{ inputs.clip_file }}
      POST_URL: ${{ inputs.post_url }}
      CONFIRM_SUBMISSION: ${{ inputs.confirm_submission }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Python syntax preflight
        run: python -m py_compile .github/scripts/phase14-content-rewards-submission.py

      - name: Validate and prepare submission candidate
        run: python .github/scripts/phase14-content-rewards-submission.py
