name: Phase 14 Content Rewards Submission Queue

on:
  workflow_dispatch:
    inputs:
      phase11_run_id:
        description: "Exact successful Phase 11 run ID whose published clips should be queued"
        required: true
        type: string
      campaign_id:
        description: "Exact active Content Rewards campaign ID selected by the automation"
        required: true
        type: string
      campaign_name:
        description: "Exact selected campaign name"
        required: true
        type: string
      campaign_status:
        description: "Current selected campaign status"
        required: true
        type: choice
        options: [active, exhausted, closed, unknown]
        default: active
      confirm_submission:
        description: "Type SUBMIT_READY to authorize queue creation"
        required: true
        type: string
      max_age_minutes:
        description: "Maximum age allowed for every publication"
        required: false
        type: string
        default: "30"

permissions:
  contents: write
  actions: read

concurrency:
  group: phase14-content-rewards-submission
  cancel-in-progress: false

jobs:
  queue:
    name: Queue all eligible Content Rewards submissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE11_RUN_ID: ${{ inputs.phase11_run_id }}
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      CAMPAIGN_NAME: ${{ inputs.campaign_name }}
      CAMPAIGN_STATUS: ${{ inputs.campaign_status }}
      CONFIRM_SUBMISSION: ${{ inputs.confirm_submission }}
      MAX_AGE_MINUTES: ${{ inputs.max_age_minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Python syntax preflight
        run: python -m py_compile .github/scripts/phase14-content-rewards-submission.py
      - name: Build complete submission queue
        run: python .github/scripts/phase14-content-rewards-submission.py
