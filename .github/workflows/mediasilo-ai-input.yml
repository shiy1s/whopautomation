name: MediaSilo AI Input Worker
"on":
  workflow_dispatch:
    inputs:
      review_url:
        description: MediaSilo review URL
        required: true
        type: string
      discovery_json:
        description: Verified discovery seed JSON in base64
        required: true
        type: string
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Crawl MediaSilo
        env:
          REVIEW_URL: ${{ inputs.review_url }}
          DISCOVERY_JSON: ${{ inputs.discovery_json }}
        run: |
          echo "$DISCOVERY_JSON" | base64 -d > seed.json
          echo "" | base64 -d > discover.mjs
          node --check discover.mjs
          node discover.mjs
      - name: Validate discovery artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='mediasilo-discovery.json';
          if(!fs.existsSync(p)) throw new Error('Discovery artifact missing');
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          if(d.complete!==true) throw new Error('Discovery did not finish completely');
          if(!Array.isArray(d.assets)||d.assets.length<2) throw new Error('Fewer than 2 assets');
          if(!Array.isArray(d.folders)||d.folders.length<3) throw new Error('Recursive folder inventory incomplete');
          if(!Array.isArray(d.visitedPages)||d.visitedPages.length<3) throw new Error('Recursive traversal evidence incomplete');
          const n=d.folders.map(f=>String(f.name||'').toLowerCase());
          if(!n.includes('background')||!n.includes('logos')) throw new Error('Background/LOGOS missing');
          const base=d.assets.filter(a=>a.fileName==='RICOCHETvideo.mp4'||a.fileName==='Richochet_V05_9x16_Final.mp4');
          if(base.length<2) throw new Error('Both baseline RICOCHET assets missing');
          if(d.assets.some(a=>!a.assetId||!a.fileName||!a.folder||!a.assetUrl)) throw new Error('Invalid asset records');
          console.log('PHASE1_DISCOVERY_VALIDATION_PASS assets='+d.assets.length+' folders='+d.folders.length+' visited='+d.visitedPages.length);
          NODE
      - name: Build Phase 4 AI input\n        env:\n          INVENTORY_JSON_B64: ${{ inputs.discovery_json }}\n        run: |\n          mkdir -p phase4-input\n          node <<'NODE'\n          const fs=require('fs'),cp=require('child_process'),path=require('path');\n          const {chromium}=require('playwright');\n          const inv=JSON.parse(Buffer.from(process.env.INVENTORY_JSON_B64,'base64').toString('utf8'));\n          const assets=(inv.assets||[]).filter(a=>a.type==='video'||/\.(mp4|mov|m4v|webm)$/i.test(String(a.fileName||'')));\n          if(assets.length<2)throw new Error('Phase 4 requires both verified video assets.');\n          const browser=await chromium.launch({headless:true});const context=await browser.newContext({ignoreHTTPSErrors:true});const sleep=ms=>new Promise(r=>setTimeout(r,ms));\n          const add=(s,v)=>{if(typeof v!=='string')return;let x=v.replace(/\u0026/g,'&').replace(/\\/g,'/');try{x=decodeURIComponent(x)}catch{}if(/^https?:\/\//.test(x)&&/\.(mp4|m3u8|mov|m4v|webm)(?:[?#]|$)/i.test(x))s.add(x)};\n          const results=[];\n          for(const a of assets){const dir=path.join('phase4-input',a.assetId),fd=path.join(dir,'frames');fs.mkdirSync(fd,{recursive:true});const page=await context.newPage(),set=new Set();page.on('response',async r=>{add(set,r.url())});try{await page.goto(a.assetUrl,{waitUntil:'domcontentloaded',timeout:90000});await sleep(9000);(await page.evaluate(()=>Array.from(document.querySelectorAll('video,source')).flatMap(e=>[e.currentSrc,e.src].filter(Boolean)))).forEach(x=>add(set,x));(await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name))).forEach(x=>add(set,x));const u=[...set].find(x=>/\.m3u8(?:[?#]|$)/i.test(x))||[...set].find(x=>/\.(mp4|mov|m4v|webm)(?:[?#]|$)/i.test(x));if(!u)throw new Error('No playable media source for '+a.assetId);const mp=path.join(dir,'source.mp4');if(/\.m3u8(?:[?#]|$)/i.test(u))cp.execFileSync('ffmpeg',['-y','-loglevel','error','-i',u,'-c','copy',mp]);else{const r=await context.request.get(u,{failOnStatusCode:false,timeout:120000});if(!r.ok())throw new Error('Media download HTTP '+r.status());fs.writeFileSync(mp,await r.body())}const d=Number(cp.execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',mp],{encoding:'utf8'}).trim());if(!Number.isFinite(d)||d<10)throw new Error('Invalid duration');const frames=[];for(let i=0;i<12;i++){const t=Math.min(d-.25,Math.max(.25,(d-.5)*(i/11)+.25)),s=t.toFixed(3),f=path.join(fd,'frame_'+String(i+1).padStart(2,'0')+'_'+s.replace('.','p')+'s.jpg');cp.execFileSync('ffmpeg',['-y','-loglevel','error','-ss',String(t),'-i',mp,'-frames:v','1','-q:v','2',f]);if(!fs.existsSync(f)||fs.statSync(f).size<1000)throw new Error('Frame extraction failed');frames.push({index:i+1,timestampSeconds:Number(s),path:f})}results.push({assetId:a.assetId,fileName:a.fileName,durationSeconds:d,sourceMediaUrl:u,frameCount:12,frames})}finally{await page.close()}}await browser.close();if(results.length!==assets.length)throw new Error('Phase 4 input coverage incomplete.');fs.writeFileSync('phase4-input/phase4-input-manifest.json',JSON.stringify({schemaVersion:'1.0',complete:true,videoAssetCount:results.length,results,generatedAt:new Date().toISOString()},null,2));console.log('PHASE4_INPUT_VALIDATION_PASS assets='+results.length+' frames='+results.reduce((n,x)=>n+x.frameCount,0));\n          NODE\n      - name: Build Phase 4 AI input\n        env:\n          INVENTORY_JSON_B64: ${{ inputs.discovery_json }}\n        run: |\n          mkdir -p phase4-input\n          node <<'NODE'\n          const fs=require('fs'),cp=require('child_process'),path=require('path');\n          const {chromium}=require('playwright');\n          const inv=JSON.parse(Buffer.from(process.env.INVENTORY_JSON_B64,'base64').toString('utf8'));\n          const assets=(inv.assets||[]).filter(a=>a.type==='video'||/\.(mp4|mov|m4v|webm)$/i.test(String(a.fileName||'')));\n          if(assets