name: MediaSilo AI Input Worker
"on":
  workflow_dispatch:
    inputs:
      review_url:
        description: MediaSilo review URL
        required: true
        type: string
      discovery_json:
        description: Verified discovery seed JSON in base64
        required: true
        type: string
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build Phase 4 AI input
        env:
          INVENTORY_JSON_B64: ${{ inputs.discovery_json }}
        run: |
          mkdir -p phase4-input
          node <<'NODE'
          (async()=>{
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const {chromium}=require('playwright');
          const inv=JSON.parse(Buffer.from(process.env.INVENTORY_JSON_B64,'base64').toString('utf8'));
          const assets=(inv.assets||[]).filter(a=>a.type==='video'||/\.(mp4|mov|m4v|webm)$/i.test(String(a.fileName||'')));
          if(assets.length<2)throw new Error('Phase 4 requires both verified video assets.');
          const browser=await chromium.launch({headless:true});const context=await browser.newContext({ignoreHTTPSErrors:true});const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const add=(s,v)=>{if(typeof v!=='string')return;let x=v.replace(/\u0026/g,'&').replace(/\\/g,'/');try{x=decodeURIComponent(x)}catch{}if(/^https?:\/\//.test(x)&&/\.(mp4|m3u8|mov|m4v|webm)(?:[?#]|$)/i.test(x))s.add(x)};
          const results=[];
          for(const a of assets){const dir=path.join('phase4-input',a.assetId),fd=path.join(dir,'frames');fs.mkdirSync(fd,{recursive:true});const page=await context.newPage(),set=new Set(); const collect=o=>{if(typeof o==='string'){add(set,o);try{const u=new URL(o);if(!/app\.mediasilo\.com|api\.mediasilo\.com/i.test(u.hostname)&&(/amazonaws|cloudfront|s3|media|stream|download/i.test(u.hostname+u.pathname)||u.search))set.add(o)}catch{} }else if(o&&typeof o==='object'){for(const v of Object.values(o))collect(v)}}; page.on('response',async r=>{add(set,r.url()); try{const ct=r.headers()['content-type']||''; if(ct.includes('json')) collect(await r.json())}catch{}});try{await page.goto(a.assetUrl,{waitUntil:'domcontentloaded',timeout:90000});await sleep(5000); try{const btn=page.getByRole('button',{name:/play/i});if(await btn.count())await btn.first().click({timeout:5000})}catch{} try{for(const f of page.frames()){const btn=f.getByRole('button',{name:/play/i});if(await btn.count())await btn.first().click({timeout:3000}).catch(()=>{})}}catch{} await sleep(5000);(await page.evaluate(()=>Array.from(document.querySelectorAll('video,source')).flatMap(e=>[e.currentSrc,e.src].filter(Boolean)))).forEach(x=>add(set,x));(await page.evaluate(()=>performance.getEntriesByType('resource').map(e=>e.name))).forEach(x=>add(set,x));const candidates=[...set].filter(x=>{try{const u=new URL(x);return !/app\.mediasilo\.com|api\.mediasilo\.com/i.test(u.hostname)}catch{return false}});let u=null;const mp=path.join(dir,'source.mp4');for(const c of candidates){try{if(/\.m3u8(?:[?#]|$)/i.test(c)){cp.execFileSync('ffmpeg',['-y','-loglevel','error','-i',c,'-c','copy',mp]);if(fs.existsSync(mp)&&fs.statSync(mp).size>100000){u=c;break}else{try{fs.unlinkSync(mp)}catch{}}}else{const r=await context.request.get(c,{failOnStatusCode:false,timeout:120000});if(!r.ok())continue;const ct=(r.headers()['content-type']||'').toLowerCase();const body=await r.body();if(ct.startsWith('video/')||ct.includes('mpegurl')||body.length>100000){fs.writeFileSync(mp,body);if(fs.statSync(mp).size>100000){u=c;break}}}}catch{try{if(fs.existsSync(mp))fs.unlinkSync(mp)}catch{}}}if(!u)throw new Error('No verified playable media response for '+a.assetId);const d=Number(cp.execFileSync('ffprobe',['-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',mp],{encoding:'utf8'}).trim());if(!Number.isFinite(d)||d<10)throw new Error('Invalid duration');const frames=[];for(let i=0;i<12;i++){const t=Math.min(d-.25,Math.max(.25,(d-.5)*(i/11)+.25)),s=t.toFixed(3),f=path.join(fd,'frame_'+String(i+1).padStart(2,'0')+'_'+s.replace('.','p')+'s.jpg');cp.execFileSync('ffmpeg',['-y','-loglevel','error','-ss',String(t),'-i',mp,'-frames:v','1','-q:v','2',f]);if(!fs.existsSync(f)||fs.statSync(f).size<1000)throw new Error('Frame extraction failed');frames.push({index:i+1,timestampSeconds:Number(s),path:f})}results.push({assetId:a.assetId,fileName:a.fileName,durationSeconds:d,sourceMediaUrl:u,frameCount:12,frames})}finally{await page.close()}}await browser.close();if(results.length!==assets.length)throw new Error('Phase 4 input coverage incomplete.');fs.writeFileSync('phase4-input/phase4-input-manifest.json',JSON.stringify({schemaVersion:'1.0',complete:true,videoAssetCount:results.length,results,generatedAt:new Date().toISOString()},null,2));console.log('PHASE4_INPUT_VALIDATION_PASS assets='+results.length+' frames='+results.reduce((n,x)=>n+x.frameCount,0));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediasilo-ai-input
          path: |
            phase4-input
            mediasilo-network.log
            mediasilo-debug.json
          retention-days: 7
          if-no-files-found: error
