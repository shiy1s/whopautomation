name: Phase 12 Publication Tracking

on:
  workflow_dispatch:
    inputs:
      phase11_run_id:
        description: "Exact successful Phase 11 run ID"
        required: true
        type: string
      platforms:
        description: "Platforms to track"
        required: true
        type: choice
        options:
          - youtube
          - youtube_instagram
        default: youtube_instagram

permissions:
  contents: write
  actions: read

concurrency:
  group: phase12-publication-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PHASE11_RUN_ID: ${{ inputs.phase11_run_id }}
      PACKAGE_DIR: phase10-publishing-package
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
      PHASE12_PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tracking inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.platforms }}" != "youtube" && "${{ inputs.platforms }}" != "youtube_instagram" ]]; then
            echo "Unsupported Phase 12 tracking platform selection."
            exit 1
          fi
          [[ "${PHASE11_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "phase11_run_id must be numeric"
            exit 1
          }

      - name: Install pinned Phase 12 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client==2.200.0 google-auth==2.58.0

      - name: Run Phase 12 tracking
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/phase12-publication-tracking.py
          python .github/scripts/phase12-publication-tracking.py
