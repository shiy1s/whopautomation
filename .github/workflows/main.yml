name: AI Video Clipping

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Drive URL of the official campaign video"
        required: true
        type: string

jobs:
  create-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official campaign video
        run: |
          pip install -q gdown
          gdown "${{ inputs.video_url }}" -O source.mp4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Gemini SDK
        run: |
          pip install -q google-genai pydantic

      - name: Check source video
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height -of default=noprint_wrappers=1 source.mp4

      - name: Analyze video and build edited clip packages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > analyze_video.py <<'PY'
          import os, json, time, subprocess
          from typing import List
          from pydantic import BaseModel, Field
          from google import genai
          from google.genai import types

          class Moment(BaseModel):
              start: str = Field(description="Absolute source start timestamp HH:MM:SS")
              end: str = Field(description="Absolute source end timestamp HH:MM:SS")
              description: str
              score: int

          class Segment(BaseModel):
              start: str = Field(description="Absolute source start timestamp HH:MM:SS")
              end: str = Field(description="Absolute source end timestamp HH:MM:SS")
              purpose: str = Field(description="hook, setup, payoff, reaction, reveal, or outro")

          class ClipCandidate(BaseModel):
              segments: List[Segment] = Field(description="1-4 non-contiguous source segments in chronological playback order")
              title: str
              hook: str
              reason: str
              score: int

          class ClipAnalysis(BaseModel):
              moments: List[Moment]
              clips: List[ClipCandidate]

          def sec(t):
              h,m,s=t.split(':')
              return int(h)*3600+int(m)*60+float(s)

          def stamp(x):
              x=int(round(x))
              return f'{x//3600:02d}:{(x%3600)//60:02d}:{x%60:02d}'

          def overlap(a,b,gap=1):
              return not (a['end_sec']+gap<=b['start_sec'] or b['end_sec']+gap<=a['start_sec'])

          duration=float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','default=noprint_wrappers=1:nokey=1','source.mp4'
          ]).decode().strip())
          print(f'Source duration: {duration:.2f}s')

          client=genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          video=client.files.upload(file='source.mp4')
          while True:
              video=client.files.get(name=video.name)
              state=getattr(video.state,'name',str(video.state))
              print(f'Gemini video state: {state}')
              if state=='ACTIVE':
                  break
              if state=='FAILED':
                  raise RuntimeError('Gemini failed to process the video.')
              time.sleep(10)

          prompt=f'''You are the lead editor for a professional viral short-form clipping team. Analyze the COMPLETE official Call of Duty RICOCHET Enforcement campaign video. Source duration: {duration:.2f} seconds.

          Your job is NOT merely to find one decent continuous timestamp. Think like a human editor who watches the whole source, identifies the best moments, then constructs several different high-retention Shorts from those moments.

          STEP 1 — FIND THE BEST MOMENTS:
          Identify at least 8 and preferably 10-15 distinct strong moments across the entire video. A moment can be an important statement, legal/enforcement action, confrontation, reaction, reveal, visual beat, setup, payoff, or natural ending. Give every moment a 1-100 score and precise timestamps.

          STEP 2 — BUILD EDITED SHORTS:
          From those moments, build 3-5 genuinely different EDITED CLIP PACKAGES for TikTok, Instagram Reels, and YouTube Shorts.

          IMPORTANT EDITING RULES:
          - A final Short may contain 1, 2, 3, or 4 separate source segments.
          - Non-contiguous segments are EXPECTED when they make the Short stronger.
          - Hard cuts are preferred to filler between moments.
          - Do not force a multi-cut edit when one continuous moment is clearly stronger.
          - When possible, make the strongest packages use 2-4 purposeful cuts rather than one long mediocre section.
          - A brief setup/hook may come first.
          - A reaction, reveal, payoff, or natural outro may come last.
          - The final sequence must be chronological in source time. Do not move a later event before an earlier event.
          - Each segment should normally be 2.5-20 seconds and end at a natural speech/action boundary.
          - Total final runtime should usually be 20-45 seconds and must be 10-60 seconds.
          - Remove dead air, repetitive explanations, weak setup, long pauses, and irrelevant footage.
          - Do not include a segment merely because it is needed to reach a duration target.
          - Each package should have a clear hook in the first few seconds and a satisfying payoff.
          - Prefer packages with a strong narrative arc: hook/setup -> escalation -> strongest moment -> reaction/payoff/outro.
          - Different packages must have substantially different core moments and should not feel like minor variations of the same Short.
          - Do not reuse the same major source moment across packages unless there are not enough distinct strong moments.
          - Do not invent dialogue, events, timestamps, people, or footage. Use ONLY what is actually in the source.
          - Preserve factual meaning. Combining separate moments is allowed, but the edit must not imply that unrelated events happened together.
          - Prioritize RICOCHET, anti-cheat enforcement, cheat providers/sellers, cease-and-desist/legal notices, confrontations, reactions, reveals, strong statements, and visually compelling moments.
          - Score each final package from 1-100 for viral short-form quality, considering hook strength, clarity, pacing, emotional payoff, uniqueness, and replay/share potential.

          IMPORTANT OUTPUT QUALITY:
          Return 8-15 strong moments AND 3-5 final clip packages. Do not return only one package when multiple distinct strong moments exist in the source.
          Timestamps must be precise HH:MM:SS and must exist inside the source duration.'''

          models=['gemini-3-flash-preview','gemini-2.5-flash','gemini-2.5-flash-lite']
          analysis=None
          last_error=None

          for model in models:
              for attempt in range(1,4):
                  try:
                      print(f'Gemini analysis: model={model}, attempt={attempt}/3...')
                      response=client.models.generate_content(
                          model=model,
                          contents=[video,prompt],
                          config=types.GenerateContentConfig(
                              response_mime_type='application/json',
                              response_schema=ClipAnalysis
                          )
                      )
                      analysis=ClipAnalysis.model_validate_json(response.text)
                      print(f'Gemini analysis succeeded with {model}.')
                      break
                  except Exception as exc:
                      last_error=exc
                      print(f'Gemini {model} attempt {attempt} failed: {exc}')
                      if attempt<3:
                          delay=10*(2**(attempt-1))
                          print(f'Waiting {delay}s before retry...')
                          time.sleep(delay)
              if analysis is not None:
                  break
              print(f'Model {model} unavailable; trying next fallback.')

          if analysis is None:
              raise RuntimeError(f'Gemini analysis failed on all fallback models: {last_error}')

          moments=[]
          for m in analysis.moments:
              try:
                  a,b=sec(m.start),sec(m.end)
                  if 0<=a<b<=duration and 1.5<=b-a<=30:
                      moments.append({
                          'start':stamp(a),'end':stamp(b),
                          'start_sec':a,'end_sec':b,
                          'description':m.description,
                          'score':max(1,min(100,int(m.score)))
                      })
              except Exception:
                  continue
          moments.sort(key=lambda x:x['score'],reverse=True)

          candidates=[]
          for c in analysis.clips:
              segs=[]
              valid=True
              try:
                  for s in c.segments:
                      a,b=sec(s.start),sec(s.end)
                      if a<0 or b>duration or b<=a or b-a<2.5 or b-a>45:
                          valid=False
                          break
                      segs.append({
                          'start':stamp(a),'end':stamp(b),
                          'start_sec':a,'end_sec':b,
                          'purpose':s.purpose
                      })
              except Exception:
                  valid=False

              if not valid or not segs or len(segs)>4:
                  continue

              # Playback order must follow the source timeline.
              if any(segs[i]['start_sec']>=segs[i+1]['start_sec'] for i in range(len(segs)-1)):
                  continue

              total=sum(x['end_sec']-x['start_sec'] for x in segs)
              if total<10 or total>60:
                  continue
              if any(overlap(segs[i],segs[j],gap=0) for i in range(len(segs)) for j in range(i+1,len(segs))):
                  continue

              score=max(1,min(100,int(c.score)))
              # Small bonus for intentional multi-cut structure, without allowing
              # the number of cuts to overpower actual content quality.
              if len(segs)>=2:
                  score=min(100,score+3)

              candidates.append({
                  'segments':segs,
                  'total_sec':total,
                  'title':c.title,
                  'hook':c.hook,
                  'reason':c.reason,
                  'score':score
              })

          candidates.sort(key=lambda x:x['score'],reverse=True)

          # Select diverse packages. Reject only substantial reuse of the same
          # source moments, rather than being overly strict about nearby timestamps.
          selected=[]
          for c in candidates:
              reused=False
              for existing in selected:
                  c_overlap=sum(
                      min(s['end_sec'],e['end_sec'])-max(s['start_sec'],e['start_sec'])
                      for s in c['segments'] for e in existing['segments']
                      if min(s['end_sec'],e['end_sec'])>max(s['start_sec'],e['start_sec'])
                  )
                  shorter=min(c['total_sec'],existing['total_sec'])
                  if shorter>0 and c_overlap/shorter>=0.60:
                      reused=True
                      break
              if reused:
                  continue
              selected.append(c)
              if len(selected)==5:
                  break

          # If Gemini supplied fewer than two valid packages, keep the strongest
          # candidate instead of failing, but expose the issue clearly in the log.
          if not selected:
              raise RuntimeError('No valid edited clips were selected.')
          if len(selected)==1:
              print('WARNING: Gemini returned only one valid diverse package.')

          final=[]
          for i,c in enumerate(selected,1):
              final.append({
                  'rank':i,
                  'segments':[{
                      'start':s['start'],
                      'end':s['end'],
                      'purpose':s['purpose']
                  } for s in c['segments']],
                  'duration_seconds':round(c['total_sec'],2),
                  'title':c['title'],
                  'hook':c['hook'],
                  'reason':c['reason'],
                  'score':c['score']
              })

          with open('clips.json','w',encoding='utf-8') as f:
              json.dump({
                  'source_duration_seconds':duration,
                  'top_moments':moments[:15],
                  'clips':final
              },f,indent=2,ensure_ascii=False)

          print(f'Identified {len(moments)} valid strong moments.')
          print(f'Selected {len(final)} diverse final clip packages.')
          print(json.dumps(final,indent=2,ensure_ascii=False))
          PY
          python analyze_video.py

      - name: Verify official logo
        run: |
          test -f "Call_of_Duty_Wordmark_Stacked_CMYK_White.png" || { echo "ERROR: Official Call of Duty logo was not found."; exit 1; }
          echo "Official logo verified."

      - name: Create professional edited 9:16 clips
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, subprocess

          with open('clips.json',encoding='utf-8') as f:
              data=json.load(f)

          logo='Call_of_Duty_Wordmark_Stacked_CMYK_White.png'
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          campaign_text='Real footage of a Call of Duty\ncheat provider being served a legal notice'
          with open('campaign_text.txt','w',encoding='utf-8') as f:
              f.write(campaign_text)

          def to_seconds(ts):
              h,m,s=ts.split(':')
              return int(h)*3600+int(m)*60+float(s)

          has_audio=subprocess.run(
              ['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=index','-of','csv=p=0','source.mp4'],
              capture_output=True,text=True
          ).stdout.strip()!=''

          for clip in data['clips']:
              rank=clip['rank']
              segments=clip['segments']
              out=f'output/clip_{rank:02d}.mp4'
              duration=sum(to_seconds(s['end'])-to_seconds(s['start']) for s in segments)
              if duration<=0:
                  raise RuntimeError(f'Invalid edited duration for clip {rank}')
              print(f'Rendering edited clip {rank}: {len(segments)} segments, {duration:.2f}s total')

              n=len(segments)
              parts=[]
              parts.append('[0:v]split='+str(n)+''.join(f'[vsrc{i}]' for i in range(n)))
              if has_audio:
                  parts.append('[0:a]asplit='+str(n)+''.join(f'[asrc{i}]' for i in range(n)))

              for i,s in enumerate(segments):
                  a=to_seconds(s['start'])
                  b=to_seconds(s['end'])
                  parts.append(f'[vsrc{i}]trim=start={a:.3f}:end={b:.3f},setpts=PTS-STARTPTS[v{i}]')
                  if has_audio:
                      parts.append(f'[asrc{i}]atrim=start={a:.3f}:end={b:.3f},asetpts=PTS-STARTPTS[a{i}]')

              if has_audio:
                  concat_inputs=''.join(f'[v{i}][a{i}]' for i in range(n))
                  parts.append(concat_inputs+f'concat=n={n}:v=1:a=1[joinedv][joineda]')
                  base_input='[joinedv]'
                  audio_map='[joineda]'
              else:
                  concat_inputs=''.join(f'[v{i}]' for i in range(n))
                  parts.append(concat_inputs+f'concat=n={n}:v=1:a=0[joinedv]')
                  base_input='[joinedv]'
                  audio_map=None

              parts.append(
                  base_input+'scale=1080:608:force_original_aspect_ratio=decrease,'
                  'pad=1080:608:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30[vid]'
              )
              parts.append(
                  f'color=c=black:s=1080x1920:r=30:d={duration:.3f}[bg]'
                  ';[bg][vid]overlay=0:656[base]'
                  ';[1:v]scale=260:-1[logo]'
                  ';[base][logo]overlay=(W-w)/2:150[branded]'
                  ';[branded]drawtext=fontfile='+font+':textfile=campaign_text.txt:'
                  'fontcolor=white:fontsize=38:line_spacing=12:'
                  'text_align=center:x=(w-text_w)/2:y=340:'
                  'shadowcolor=black@0.8:shadowx=2:shadowy=2:fix_bounds=1[outv]'
              )

              fc=';'.join(parts)
              cmd=[
                  'ffmpeg','-hide_banner','-loglevel','warning','-y',
                  '-i','source.mp4','-loop','1','-i',logo,
                  '-filter_complex',fc,
                  '-map','[outv]'
              ]
              if audio_map:
                  cmd+=['-map',audio_map]
              cmd+=[
                  '-t',f'{duration:.3f}','-r','30',
                  '-c:v','libx264','-preset','veryfast','-crf','22','-threads','2',
                  '-c:a','aac','-b:a','128k','-movflags','+faststart','-shortest',out
              ]
              subprocess.run(cmd,check=True)
              print(f'Created {out}')
          PY

      - name: Validate generated clips
        run: |
          set -e
          test -n "$(find output -name '*.mp4' -print -quit)" || { echo "ERROR: No clips generated."; exit 1; }
          for file in output/*.mp4; do
            echo "===================================="
            echo "Checking $file"
            echo "===================================="
            ffprobe -v error -show_entries format=duration -show_entries stream=width,height,codec_name -of default=noprint_wrappers=1 "$file"
          done

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: professional-cod-clips
          path: output/

      - name: Upload clip analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-analysis
          path: clips.json
