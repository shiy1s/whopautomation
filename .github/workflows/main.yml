name: AI Video Clipping

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Drive URL of the official campaign video"
        required: true
        type: string

jobs:
  create-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official campaign video
        run: |
          pip install -q gdown
          gdown "${{ inputs.video_url }}" -O source.mp4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Gemini SDK
        run: |
          pip install -q google-genai pydantic

      - name: Check source video
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height -of default=noprint_wrappers=1 source.mp4

      - name: Analyze video and build edited clip packages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > analyze_video.py <<'PY'
          import os, json, time, subprocess
          from typing import List
          from pydantic import BaseModel, Field
          from google import genai
          from google.genai import types

          class Segment(BaseModel):
              start: str = Field(description="Absolute source start timestamp HH:MM:SS")
              end: str = Field(description="Absolute source end timestamp HH:MM:SS")
              purpose: str = Field(description="hook, setup, payoff, reaction, reveal, or outro")

          class ClipCandidate(BaseModel):
              segments: List[Segment] = Field(description="1-4 non-contiguous source segments, in playback order")
              title: str
              hook: str
              reason: str
              score: int

          class ClipAnalysis(BaseModel):
              clips: List[ClipCandidate]

          def sec(t):
              h,m,s=t.split(':'); return int(h)*3600+int(m)*60+float(s)
          def stamp(x):
              x=int(round(x)); return f'{x//3600:02d}:{(x%3600)//60:02d}:{x%60:02d}'
          def overlap(a,b,gap=1):
              return not (a['end_sec']+gap<=b['start_sec'] or b['end_sec']+gap<=a['start_sec'])

          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','source.mp4']).decode().strip())
          print(f'Source duration: {duration:.2f}s')
          client=genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          video=client.files.upload(file='source.mp4')
          while True:
              video=client.files.get(name=video.name)
              state=getattr(video.state,'name',str(video.state))
              print(f'Gemini video state: {state}')
              if state=='ACTIVE': break
              if state=='FAILED': raise RuntimeError('Gemini failed to process the video.')
              time.sleep(10)

          prompt=f'''You are a professional short-form video editor. Analyze the COMPLETE official Call of Duty RICOCHET Enforcement campaign video. Source duration: {duration:.2f} seconds.

          Build 2-5 EDITED CLIP PACKAGES for TikTok, Instagram Reels, and YouTube Shorts.

          IMPORTANT EDITING RULE:
          A final clip does NOT have to be one continuous source section. You may combine 2, 3, or 4 strong source segments into one polished short using hard cuts. Intro/setup and outro/ending segments are allowed when they improve the story. For example, a short can use a brief setup, then jump to the strongest enforcement moment, then a reaction/payoff, then an ending. This is intentional editing, NOT a requirement to keep one continuous timestamp.

          For each package:
          - Use 1-4 source segments, in the exact playback order.
          - Total final runtime should usually be 15-45 seconds and must be 10-60 seconds.
          - Each segment should normally be at least 2.5 seconds and should start/end at natural speech or action boundaries.
          - The combined segments must tell one coherent mini-story and feel intentionally edited.
          - The first segment should be a strong hook/setup when useful, but do NOT force an intro if the strongest moment works better immediately.
          - The last segment may be a natural outro, reaction, reveal, or payoff when useful.
          - Prioritize the strongest enforcement, cease and desist, cheat provider, legal notice, confrontation, reaction, reveal, strong statement, or visually interesting moment.
          - Remove dead air, repetitive material, weak setup, long pauses, and irrelevant sections by simply not selecting them.
          - Do not select multiple packages that tell the same story or reuse the same major moment.
          - Do not invent dialogue, events, timestamps, or footage. ONLY use footage that actually exists in the source video.
          - Preserve factual meaning. Editing may reorder separate moments into a coherent sequence, but must not create a misleading claim that did not happen.
          - Prefer precise, punchy edits over long clips. Hard cuts are acceptable and preferred to awkward filler.
          - Score each package from 1-100 for viral short-form quality.

          Return the strongest 2-5 edited clip packages. Timestamps must be precise HH:MM:SS.'''

          # Gemini can temporarily return 503/UNAVAILABLE during periods of high demand.
          # Retry with exponential backoff before failing the workflow.
          analysis = None
          last_error = None
          for attempt in range(1, 5):
              try:
                  print(f'Gemini analysis attempt {attempt}/4...')
                  response=client.models.generate_content(
                      model='gemini-3-flash-preview',
                      contents=[video,prompt],
                      config=types.GenerateContentConfig(
                          response_mime_type='application/json',
                          response_schema=ClipAnalysis
                      )
                  )
                  analysis=ClipAnalysis.model_validate_json(response.text)
                  print('Gemini analysis succeeded.')
                  break
              except Exception as exc:
                  last_error=exc
                  print(f'Gemini analysis attempt {attempt} failed: {exc}')
                  if attempt < 4:
                      delay=10 * (2 ** (attempt - 1))
                      print(f'Waiting {delay}s before retry...')
                      time.sleep(delay)

          if analysis is None:
              raise RuntimeError(f'Gemini analysis failed after 4 attempts: {last_error}')

          candidates=[]
          for c in analysis.clips:
              segs=[]
              valid=True
              for s in c.segments:
                  a,b=sec(s.start),sec(s.end)
                  if a<0 or b>duration or b<=a or (b-a)<2.5 or (b-a)>45:
                      valid=False; break
                  segs.append({'start':stamp(a),'end':stamp(b),'start_sec':a,'end_sec':b,'purpose':s.purpose})
              if not valid or not segs or len(segs)>4: continue
              segs.sort(key=lambda x:x['start_sec'])
              total=sum(x['end_sec']-x['start_sec'] for x in segs)
              if total<10 or total>60: continue
              # Reject overlapping source segments inside the same package.
              if any(overlap(segs[i],segs[j],gap=0) for i in range(len(segs)) for j in range(i+1,len(segs))): continue
              candidates.append({'segments':segs,'total_sec':total,'title':c.title,'hook':c.hook,'reason':c.reason,'score':c.score})

          candidates.sort(key=lambda x:x['score'],reverse=True)
          selected=[]
          for c in candidates:
              # Avoid reusing the same major source moments across final packages.
              flattened=c['segments']
              if any(any(overlap(s,e,gap=2) for s in flattened for e in existing['segments']) for existing in selected):
                  continue
              selected.append(c)
              if len(selected)==5: break

          if not selected: raise RuntimeError('No valid edited clips were selected.')
          final=[]
          for i,c in enumerate(selected,1):
              final.append({
                  'rank':i,
                  'segments':[{'start':s['start'],'end':s['end'],'purpose':s['purpose']} for s in c['segments']],
                  'duration_seconds':round(c['total_sec'],2),
                  'title':c['title'],'hook':c['hook'],'reason':c['reason'],'score':c['score']
              })
          with open('clips.json','w',encoding='utf-8') as f:
              json.dump({'source_duration_seconds':duration,'clips':final},f,indent=2,ensure_ascii=False)
          print(json.dumps(final,indent=2,ensure_ascii=False))
          PY
          python analyze_video.py

      - name: Verify official logo
        run: |
          test -f "Call_of_Duty_Wordmark_Stacked_CMYK_White.png" || { echo "ERROR: Official Call of Duty logo was not found."; exit 1; }
          echo "Official logo verified."

      - name: Create professional edited 9:16 clips
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, subprocess, os
          with open('clips.json',encoding='utf-8') as f: data=json.load(f)
          logo='Call_of_Duty_Wordmark_Stacked_CMYK_White.png'
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          campaign_text='Real footage of a Call of Duty\ncheat provider being served a legal notice'
          with open('campaign_text.txt','w',encoding='utf-8') as f: f.write(campaign_text)

          def to_seconds(ts):
              h,m,s=ts.split(':')
              return int(h)*3600+int(m)*60+float(s)

          has_audio=subprocess.run(
              ['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=index','-of','csv=p=0','source.mp4'],
              capture_output=True,text=True
          ).stdout.strip() != ''

          for clip in data['clips']:
              rank=clip['rank']; segments=clip['segments']; out=f'output/clip_{rank:02d}.mp4'
              duration=sum(to_seconds(s['end'])-to_seconds(s['start']) for s in segments)
              if duration <= 0:
                  raise RuntimeError(f'Invalid edited duration for clip {rank}')
              print(f'Rendering edited clip {rank}: {len(segments)} segments, {duration:.2f}s total')

              parts=[]
              for i,s in enumerate(segments):
                  a=to_seconds(s['start']); b=to_seconds(s['end'])
                  parts.append(f'[0:v]trim=start={a:.3f}:end={b:.3f},setpts=PTS-STARTPTS[v{i}]')
                  if has_audio:
                      parts.append(f'[0:a]atrim=start={a:.3f}:end={b:.3f},asetpts=PTS-STARTPTS[a{i}]')

              if has_audio:
                  concat_inputs=''.join(f'[v{i}][a{i}]' for i in range(len(segments)))
                  parts.append(concat_inputs+f'concat=n={len(segments)}:v=1:a=1[joinedv][joineda]')
                  base_input='[joinedv]'
                  audio_map='[joineda]'
              else:
                  concat_inputs=''.join(f'[v{i}]' for i in range(len(segments)))
                  parts.append(concat_inputs+f'concat=n={len(segments)}:v=1:a=0[joinedv]')
                  base_input='[joinedv]'
                  audio_map=None

              parts.append(
                  base_input+'scale=1080:608:force_original_aspect_ratio=decrease,'
                  'pad=1080:608:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30[vid]'
              )
              parts.append(
                  f'color=c=black:s=1080x1920:r=30:d={duration:.3f}[bg];'
                  '[bg][vid]overlay=0:656[base];'
                  '[1:v]scale=260:-1[logo];'
                  '[base][logo]overlay=(W-w)/2:174[branded];'
                  '[branded]drawtext=fontfile='+font+':textfile=campaign_text.txt:'
                  'fontcolor=white:fontsize=40:line_spacing=10:'
                  'text_align=center:x=(w-text_w)/2:y=330:'
                  'shadowcolor=black@0.8:shadowx=2:shadowy=2:fix_bounds=1[outv]'
              )
              fc=';'.join(parts)

              cmd=[
                'ffmpeg','-hide_banner','-loglevel','warning','-y',
                '-i','source.mp4','-loop','1','-i',logo,
                '-filter_complex',fc,'-map','[outv]'
              ]
              if audio_map:
                  cmd += ['-map',audio_map]
              cmd += [
                '-t',f'{duration:.3f}','-r','30',
                '-c:v','libx264','-preset','veryfast','-crf','22','-threads','2',
                '-c:a','aac','-b:a','128k','-movflags','+faststart','-shortest',out
              ]
              subprocess.run(cmd,check=True)
              print(f'Created {out}')
          PY

      - name: Validate generated clips
        run: |
          set -e
          test -n "$(find output -name '*.mp4' -print -quit)" || { echo "ERROR: No clips generated."; exit 1; }
          for file in output/*.mp4; do
            echo "===================================="
            echo "Checking $file"
            echo "===================================="
            ffprobe -v error -show_entries format=duration -show_entries stream=width,height,codec_name -of default=noprint_wrappers=1 "$file"
          done

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: professional-cod-clips
          path: output/

      - name: Upload clip analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-analysis
          path: clips.json
