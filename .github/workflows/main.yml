name: AI Video Clipping

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Drive URL of the official campaign video"
        required: true
        type: string

jobs:
  create-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official campaign video
        run: |
          pip install -q gdown
          gdown "${{ inputs.video_url }}" -O source.mp4
          test -s source.mp4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Gemini SDK
        run: |
          pip install -q google-genai pydantic

      - name: Check source video
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height -of default=noprint_wrappers=1 source.mp4

      - name: Analyze video and build edited clip packages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > analyze_video.py <<'PY'
          import os, json, time, subprocess
          from typing import List
          from pydantic import BaseModel
          from google import genai
          from google.genai import types

          class Moment(BaseModel):
              start: str
              end: str
              description: str
              score: int

          class Segment(BaseModel):
              start: str
              end: str
              purpose: str

          class Caption(BaseModel):
              start: str
              end: str
              text: str

          class ClipCandidate(BaseModel):
              segments: List[Segment]
              title: str
              hook: str
              reason: str
              score: int

          class ClipAnalysis(BaseModel):
              moments: List[Moment]
              clips: List[ClipCandidate]
              captions: List[Caption]

          def sec(t):
              p=t.split(':')
              if len(p)!=3: raise ValueError(t)
              return int(p[0])*3600+int(p[1])*60+float(p[2])

          def stamp(x):
              x=max(0,int(round(x)))
              return f'{x//3600:02d}:{(x%3600)//60:02d}:{x%60:02d}'

          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','source.mp4']).decode().strip())
          print(f'Source duration: {duration:.2f}s')

          client=genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          video=client.files.upload(file='source.mp4')
          while True:
              video=client.files.get(name=video.name)
              state=getattr(video.state,'name',str(video.state))
              print(f'Gemini video state: {state}')
              if state=='ACTIVE': break
              if state=='FAILED': raise RuntimeError('Gemini failed to process the video.')
              time.sleep(8)

          prompt=f'''You are the lead editor for a professional viral short-form clipping team. Analyze the COMPLETE official Call of Duty RICOCHET Enforcement campaign video. Source duration: {duration:.2f} seconds.

          GOAL: create several genuinely strong Shorts from the source, not random long excerpts.

          FIND MOMENTS: Identify 8-15 distinct strong moments across the whole source. Prioritize RICOCHET, anti-cheat enforcement, cheat providers/sellers, legal or cease-and-desist notices, confrontations, reactions, reveals, strong statements and visually compelling moments. Give precise source timestamps and 1-100 scores.

          BUILD CLIPS: Build 3-5 genuinely different clip packages. Each package may contain 1-4 separate source segments. Non-contiguous segments are encouraged when they improve pacing and storytelling. Use hook -> escalation -> strongest moment -> payoff when supported. Intro/setup and outro are allowed when useful. Hard cuts are preferred.

          RULES: Segment order must be chronological in the original source. Each segment normally 2.5-20 seconds. Total package runtime 10-60 seconds, preferably 20-45. Remove dead air, repetition, weak setup and irrelevant footage. Do not force multiple cuts when one continuous moment is stronger. Do not invent dialogue, events or timestamps. Combining separate moments is allowed, but do not imply unrelated events happened together. Different packages should use substantially different core moments. Score each package 1-100 for hook, clarity, pacing, payoff, uniqueness and share/replay potential.

          CAPTIONS: Transcribe only actual spoken dialogue from the source. Return short readable caption lines, normally 2-8 words each, with precise ABSOLUTE SOURCE timestamps. Do not invent words. Captions may cover the whole source; the renderer keeps only captions inside selected segments.

          Return 8-15 moments, 3-5 clip packages, and accurate spoken captions. All timestamps use HH:MM:SS.'''

          models=['gemini-3-flash-preview','gemini-2.5-flash','gemini-2.5-flash-lite']
          analysis=None; last_error=None
          for model in models:
              for attempt in range(1,4):
                  try:
                      print(f'Gemini analysis: model={model}, attempt={attempt}/3')
                      response=client.models.generate_content(model=model,contents=[video,prompt],config=types.GenerateContentConfig(response_mime_type='application/json',response_schema=ClipAnalysis))
                      analysis=ClipAnalysis.model_validate_json(response.text)
                      print(f'Gemini analysis succeeded with {model}.')
                      break
                  except Exception as exc:
                      last_error=exc
                      print(f'Gemini {model} attempt {attempt} failed: {exc}')
                      if attempt<3: time.sleep(10*(2**(attempt-1)))
              if analysis is not None: break
          if analysis is None: raise RuntimeError(f'Gemini analysis failed on all fallback models: {last_error}')

          moments=[]
          for m in analysis.moments:
              try:
                  a,b=sec(m.start),sec(m.end)
                  if 0<=a<b<=duration and 1.5<=b-a<=30:
                      moments.append({'start':stamp(a),'end':stamp(b),'start_sec':a,'end_sec':b,'description':m.description,'score':max(1,min(100,int(m.score)))})
              except Exception: pass
          moments.sort(key=lambda x:x['score'],reverse=True)

          candidates=[]
          for c in analysis.clips:
              segs=[]; valid=True
              try:
                  for s in c.segments:
                      a,b=sec(s.start),sec(s.end)
                      if not (0<=a<b<=duration and 2.5<=b-a<=45): valid=False; break
                      segs.append({'start':stamp(a),'end':stamp(b),'start_sec':a,'end_sec':b,'purpose':s.purpose})
              except Exception: valid=False
              if not valid or not (1<=len(segs)<=4): continue
              if any(segs[i]['start_sec']>=segs[i+1]['start_sec'] for i in range(len(segs)-1)): continue
              total=sum(s['end_sec']-s['start_sec'] for s in segs)
              if not (10<=total<=60): continue
              candidates.append({'segments':segs,'duration_seconds':round(total,2),'title':c.title,'hook':c.hook,'reason':c.reason,'score':max(1,min(100,int(c.score)))})
          candidates.sort(key=lambda c:c['score'],reverse=True)

          selected=[]
          for c in candidates:
              reused=False
              for e in selected:
                  overlap=sum(max(0,min(a['end_sec'],b['end_sec'])-max(a['start_sec'],b['start_sec'])) for a in c['segments'] for b in e['segments'])
                  if overlap/min(c['duration_seconds'],e['duration_seconds'])>=0.60: reused=True; break
              if not reused: selected.append(c)
              if len(selected)>=5: break
          if not selected: raise RuntimeError('No valid edited clip packages returned by Gemini.')

          captions=[]
          for cap in analysis.captions:
              try:
                  a,b=sec(cap.start),sec(cap.end); text=' '.join(str(cap.text).split())
                  if 0<=a<b<=duration and text and len(text)<=120: captions.append({'start_sec':a,'end_sec':b,'text':text})
              except Exception: pass
          captions.sort(key=lambda x:x['start_sec'])

          final=[]
          for i,c in enumerate(selected,1):
              final.append({'rank':i,'segments':[{'start':s['start'],'end':s['end'],'purpose':s['purpose']} for s in c['segments']],'duration_seconds':c['duration_seconds'],'title':c['title'],'hook':c['hook'],'reason':c['reason'],'score':c['score']})
          with open('clips.json','w',encoding='utf-8') as f:
              json.dump({'source_duration_seconds':duration,'top_moments':moments[:15],'captions':captions,'clips':final},f,indent=2,ensure_ascii=False)
          print(f'Identified {len(moments)} strong moments; selected {len(final)} clips; captured {len(captions)} caption lines.')
          PY
          python analyze_video.py

      - name: Verify official logo and headline asset
        run: |
          test -f "Call_of_Duty_Wordmark_Stacked_CMYK_White.png"
          test -f "campaign_text.txt"
          echo "Brand assets verified."

      - name: Create professional edited 9:16 clips with synced captions
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p output caption_files
          python - <<'PY'
          import json, os, subprocess
          with open('clips.json',encoding='utf-8') as f: data=json.load(f)
          logo='Call_of_Duty_Wordmark_Stacked_CMYK_White.png'
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          def sec(ts):
              h,m,s=ts.split(':'); return int(h)*3600+int(m)*60+float(s)
          def ass_time(x):
              x=max(0,x); h=int(x//3600); m=int((x%3600)//60); s=x-h*3600-m*60
              return f'{h}:{m:02d}:{s:05.2f}'
          def ass_escape(t):
              return str(t).replace('\\','\\\\').replace('{','\\{').replace('}','\\}').replace('\n',' ')

          def make_ass(clip,idx):
              rows=[]; cursor=0.0
              for seg in clip['segments']:
                  sa,sb=sec(seg['start']),sec(seg['end'])
                  for cap in data.get('captions',[]):
                      a=max(sa,cap['start_sec']); b=min(sb,cap['end_sec'])
                      if b<=a: continue
                      rows.append((cursor+a-sa,cursor+b-sa,ass_escape(cap['text'])))
                  cursor += sb-sa
              path=os.path.abspath(f'caption_files/captions_{idx:02d}.ass')
              with open(path,'w',encoding='utf-8') as f:
                  f.write('[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nScaledBorderAndShadow: yes\n\n')
                  f.write('[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n')
                  f.write('Style: Default,DejaVu Sans,42,&H00FFFFFF,&H00FFFFFF,&H00000000,&H99000000,1,0,0,0,100,100,0,0,1,3,1,2,70,70,560,1\n\n')
                  f.write('[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n')
                  for a,b,t in rows: f.write(f'Dialogue: 0,{ass_time(a)},{ass_time(b)},Default,,0,0,560,,{t}\n')
              print(f'Caption file created: {path} ({len(rows)} lines)')
              return path

          audio=bool(subprocess.run(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=index','-of','csv=p=0','source.mp4'],capture_output=True,text=True).stdout.strip())
          for clip in data['clips']:
              idx=clip['rank']; segs=clip['segments']; out=f'output/clip_{idx:02d}.mp4'
              total=sum(sec(s['end'])-sec(s['start']) for s in segs)
              ass=make_ass(clip,idx).replace('\\','/')
              n=len(segs)
              parts=[f'[0:v]split={n}'+''.join(f'[vs{i}]' for i in range(n))]
              if audio: parts.append(f'[0:a]asplit={n}'+''.join(f'[as{i}]' for i in range(n)))
              for i,s in enumerate(segs):
                  a,b=sec(s['start']),sec(s['end'])
                  parts.append(f'[vs{i}]trim=start={a:.3f}:end={b:.3f},setpts=PTS-STARTPTS[v{i}]')
                  if audio: parts.append(f'[as{i}]atrim=start={a:.3f}:end={b:.3f},asetpts=PTS-STARTPTS[a{i}]')
              if audio:
                  parts.append(''.join(f'[v{i}][a{i}]' for i in range(n))+f'concat=n={n}:v=1:a=1[jv][ja]'); base='[jv]'; amap='[ja]'
              else:
                  parts.append(''.join(f'[v{i}]' for i in range(n))+f'concat=n={n}:v=1:a=0[jv]'); base='[jv]'; amap=None
              parts.append(base+'scale=1080:608:force_original_aspect_ratio=decrease,pad=1080:608:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30[vid]')
              parts.append(f'color=c=black:s=1080x1920:r=30:d={total:.3f}[bg]')
              parts.append('[bg][vid]overlay=0:656[base]')
              parts.append('[1:v]scale=230:-1[logo]')
              parts.append('[base][logo]overlay=(W-w)/2:125[branded]')
              parts.append('[branded]drawtext=fontfile='+font+':textfile=campaign_text.txt:fontcolor=white:fontsize=36:line_spacing=12:text_align=center:x=(w-text_w)/2:y=335:shadowcolor=black@0.8:shadowx=2:shadowy=2:fix_bounds=1[headed]')
              parts.append(f'[headed]subtitles=filename={ass}:fontsdir=/usr/share/fonts/truetype/dejavu[outv]')
              graph=';'.join(parts)
              cmd=['ffmpeg','-hide_banner','-loglevel','warning','-y','-i','source.mp4','-loop','1','-i',logo,'-filter_complex',graph,'-map','[outv]']
              if audio: cmd+=['-map',amap]
              cmd+=['-t',f'{total:.3f}','-r','30','-c:v','libx264','-preset','veryfast','-crf','22','-threads','2']
              cmd+=['-c:a','aac','-b:a','128k'] if audio else ['-an']
              cmd+=['-movflags','+faststart','-shortest',out]
              print(f'Rendering clip {idx}: {n} segments, {total:.2f}s, captions={ass}')
              subprocess.run(cmd,check=True)
          PY

      - name: Validate generated clips
        run: |
          set -euo pipefail
          count=$(find output -maxdepth 1 -name 'clip_*.mp4' | wc -l)
          test "$count" -ge 1
          for f in output/clip_*.mp4; do
            duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")
            height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")
            echo "$f: ${duration}s ${width}x${height}"
            python - "$duration" "$width" "$height" <<'PY'
          import sys
          d=float(sys.argv[1]); w=int(sys.argv[2]); h=int(sys.argv[3])
          assert 10 <= d <= 60, d
          assert w==1080 and h==1920, (w,h)
          PY
          done

      - name: Upload generated clips
        uses: actions/upload-artifact@v4
        with:
          name: professional-cod-clips
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload clip analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-analysis
          path: clips.json
          if-no-files-found: error
          retention-days: 7
